spring.application.name=e-commerce

# Perfil activo: cambiá "h2" por "mysql" para usar phpMyAdmin
spring.profiles.active=mysql

# JPA / Hibernate (Configuraciones comunes para ambas bases de datos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Usuario administrador inicial: se crea al arrancar si se definen ambas variables de entorno
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
